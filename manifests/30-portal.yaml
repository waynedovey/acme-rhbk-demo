apiVersion: apps/v1
kind: Deployment
metadata:
  name: acme-portal
  namespace: rhbk
  labels:
    app: acme-portal
    app.kubernetes.io/part-of: acme-rhbk-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acme-portal
  template:
    metadata:
      labels:
        app: acme-portal
        app.kubernetes.io/part-of: acme-rhbk-demo
    spec:
      containers:
        - name: portal
          image: registry.access.redhat.com/ubi9/python-311:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "/opt/app/app.py"]
          env:
            - name: KEYCLOAK_URL
              value: ""
            - name: REALM
              value: acme-demo
            - name: CLIENT_ID
              value: acme-portal
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: acme-demo-secrets
                  key: portal-client-secret
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: code
              mountPath: /opt/app
      volumes:
        - name: code
          configMap:
            name: acme-portal-code
---
apiVersion: v1
kind: Service
metadata:
  name: acme-portal
  namespace: rhbk
  labels:
    app.kubernetes.io/part-of: acme-rhbk-demo
spec:
  selector:
    app: acme-portal
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: acme-portal
  namespace: rhbk
  labels:
    app.kubernetes.io/part-of: acme-rhbk-demo
spec:
  to:
    kind: Service
    name: acme-portal
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
