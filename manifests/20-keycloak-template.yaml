# This template is rendered by scripts/deploy-keycloak.sh.
# __KEYCLOAK_URL__ is replaced with the OpenShift Route URL.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: acme-keycloak
  namespace: rhbk
  labels:
    app.kubernetes.io/part-of: acme-rhbk-demo
spec:
  instances: 1
  db:
    vendor: postgres
    host: postgres-db
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  http:
    httpEnabled: true
  hostname:
    hostname: __KEYCLOAK_URL__
  ingress:
    enabled: false
  proxy:
    headers: xforwarded
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
